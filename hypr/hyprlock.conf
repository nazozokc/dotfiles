# hyprlock configuration
# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 5
    noise = 0.01
    contrast = 0.9
    brightness = 0.6
    vibrancy = 0.2
    vibrancy_darkness = 0.5
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgba(cba6f7ee)
    inner_color = rgba(1e1e2eff)
    font_color = rgba(cdd6f4ff)
    fade_on_empty = false
    placeholder_text = <span foreground="##cdd6f4ff">Password...</span>
    hide_input = false
    position = 0, -120
    halign = center
    valign = center
}

# Clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(cdd6f4ff)
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%Y-%m-%d")"
    color = rgba(a6adc8ff)
    font_size = 24
    font_family = JetBrainsMono Nerd Font
    position = 0, 20
    halign = center
    valign = center
}
