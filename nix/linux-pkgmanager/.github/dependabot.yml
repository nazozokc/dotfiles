version: 2

updates:
  # ユーザー向けの flake
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      # 毎日。nixpkgs の更新は下流を壊しやすい
      interval: "daily"
      time: "05:10"
      timezone: "UTC"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "nix"
      include: "scope"
    groups:
      # 公開 API の土台は nixpkgs。
      # 1 PR にまとめないと「nixpkgs を上げた途端に全部赤」になる
      nixpkgs:
        patterns:
          - "nixpkgs"
      # これらは lock だけなのでまとめる。まとめて上げても 1 回で検証できる
      tooling:
        patterns:
          - "flake-parts"
          - "treefmt-nix"
          - "nix-github-actions"
          - "nixpkgs-lib"

  # GitHub Actions。
  # action を上げると CI が動く土台そのものが変わるため、週 1 に留める
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:30"
      timezone: "UTC"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
