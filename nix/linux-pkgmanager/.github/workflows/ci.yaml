name: CI

on:
  push:
    branches:
      - main
  pull_request:

# check はビルドと実行だけ。書き込むのは cache なので読み取りで足りる
permissions:
  contents: read

# 同じ ref への新しい push が来たら走っている分は打ち切る
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  # matrix を Nix 側から作る。
  # checks.<system>.<name> を足した分だけジョブが増える。
  # attr 名を手で列挙しないので、check を追加して CI が回らない、という抜けが起きない
  nix-matrix:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: cachix/install-nix-action@v31.11.1

      - id: set-matrix
        name: Generate Nix Matrix
        run: |
          set -Eeu
          # include を取り出すのは、mkGithubMatrix が
          # { checks = ...; matrix = { include = [ ... ]; }; } を返すため
          matrix="$(nix eval --json '.#githubActions.matrix.include')"
          echo "matrix=$matrix" >>"$GITHUB_OUTPUT"

  # 1 check 1 ジョブ。落ちた check の原因が切り分けやすい
  check:
    name: ${{ matrix.name }} (${{ matrix.system }})
    needs: nix-matrix
    # os は matrix から来る (x86_64 -> ubuntu-24.04, aarch64 -> ubuntu-24.04-arm)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # 1 check が落ちても他は走らせる。まとめて落ちると原因が分からない
      fail-fast: false
      matrix: ${{ fromJSON(needs.nix-matrix.outputs.matrix) }}
    # attr は環境変数で渡す。shell の引用規則に依存させないため
    # env 宣言の値をそのまま "$CHECK_ATTR" で参照する
    env:
      CHECK_ATTR: ${{ matrix.attr }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: cachix/install-nix-action@v31.11.1

      - name: Run check
        run: |
          set -Eeu
          # attr は nix-github-actions が作った属性パス。
          # - を含む名前は nix-github-actions が引用符つきで出すので、
          # env 経由で渡すとその引用符が Nix の式としてそのまま効く
          nix build -L ".#$CHECK_ATTR"
