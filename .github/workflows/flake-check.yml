name: Nix Flake Check
on:
  push:
    branches: [main]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - ".github/workflows/flake-check.yml"
      - ".github/workflows/_nix-ci.yml"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: flake-check (${{ matrix.os }})
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - macos-15-intel
    uses: ./.github/workflows/_nix-ci.yml
    with:
      runs-on: ${{ matrix.os }}
      # checks (deadnix / statix / my-scripts / nu-check / typos) も
      # flake check に含まれるため、追加のステップは不要
      # treefmt は下の fmt-check job (nix fmt -- --ci) で検証する
      run-command: nix flake check
      # macos-15-intel は my-scripts のビルドに時間がかかるため他より長く取る
      timeout-minutes: ${{ matrix.os == 'macos-15-intel' && 40 || 20 }}

  fmt-check:
    name: treefmt-ci (${{ matrix.os }})
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - macos-15-intel
    uses: ./.github/workflows/_nix-ci.yml
    with:
      runs-on: ${{ matrix.os }}
      run-command: nix fmt -- --ci
      # macos-15-intel は formatter の初回ビルドに 10 分以上かかることがある
      timeout-minutes: 20
