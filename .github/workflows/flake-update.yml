name: Update flake.lock (auto-merge)
on:
  schedule:
    - cron: "0 */6 * * *" # 6時間ごと
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  pull-requests: write
jobs:
  update-flake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
      - name: Update flake.lock
        run: nix flake update
      - name: Check flake
        run: nix flake check
      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          # auto-merge は CI 完了を待たず即マージされる (branch protection なし)。
          # PR が閉じた直後に pull_request CI が起動すると merge ref が消えて
          # workflow file issue で落ちる。検証は上の "Check flake" が担うため
          # bot PR の PR CI だけ [skip ci] でスキップする。タイトル側には付けない
          # (squash 後の main push CI は残すため)。
          commit-message: "chore(nix): update flake.lock [skip ci]"
          title: "chore(nix): update flake.lock"
          body: |
            Automated flake.lock update.
            - nix flake update
            - nix flake check passed
          branch: flake-update
          delete-branch: true
          labels: |
            nix
            dependencies
      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge --auto --squash "${{ steps.cpr.outputs.pull-request-number }}"
