# wsl/wsl.conf
# WSL ディストロ別設定 (Arch Linux) — /etc/wsl.conf に配置する
# 適用には `sudo ~/.scripts/wsl-setup.sh` を実行 → `wsl --shutdown` で再起動
#
# 公式ドキュメント: https://learn.microsoft.com/en-us/windows/wsl/wsl-config

[boot]
# home-manager の systemd タイマー (nix-store GC など) に必須
systemd=true

[automount]
# Windows ドライブの自動マウント
enabled=true
# metadata: ファイル権限のメタデータ保持 / umask: ディレクトリ / fmask: ファイル
# NOTE: このオプションは以前 .wslconfig に誤配置されており効いていなかった
options="metadata,umask=22,fmask=11"
# /etc/fstab を処理しない (WSL の自動マウントのみ使用)
mountFsTab=false

[network]
# /etc/hosts を自動生成
generateHosts=true
# /etc/resolv.conf を自動生成 (VPN 等での DNS 破壊時は false にして手動管理)
generateResolvConf=true

[interop]
# Windows プロセスの起動 (.exe) を許可
enabled=true
# Windows の PATH を $PATH に追加
appendWindowsPath=true

[user]
# デフォルトユーザー
default=nazozokc

[time]
# Windows のタイムゾーンと同期
useWindowsTimezone=true